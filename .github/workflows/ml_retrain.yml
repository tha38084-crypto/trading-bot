name: Plan B AI-Copilot ML Auto-Retrain

on:
  schedule:
    # Runs every Sunday at 12:00 PM (UTC) (7:00 PM Cambodia time)
    - cron: '0 12 * * 0'
  workflow_dispatch:  # Allows manual run anytime from GitHub website

jobs:
  run-ml-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance numpy pandas pytz scikit-learn google-generativeai

      - name: Run Plan B ML Retraining
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python plan_b_adaptive.py --retrain

      - name: Persist Updated ML Model & Learning Logs
        run: |
          git config --global user.name 'PlanB-Cloud-Bot'
          git config --global user.email 'bot@planb.ai'
          git add adaptive_learning_log.json adaptive_rules.json || true
          git commit -m "Auto-retrain ML Model [skip ci]" || true
          git push || true
