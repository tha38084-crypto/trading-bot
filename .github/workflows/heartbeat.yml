name: Plan B AI-Copilot Daily Heartbeat

on:
  schedule:
    # Runs every day at 14:00 UTC (9:00 PM Cambodia time) after market close
    - cron: '0 14 * * 1-5'
  workflow_dispatch:  # Allows manual run anytime from GitHub website

jobs:
  run-heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance numpy pandas pytz scikit-learn google-generativeai

      - name: Send Daily Heartbeat & Health Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python plan_b_adaptive.py --heartbeat

      - name: Persist Balance History
        run: |
          git config --global user.name 'PlanB-Cloud-Bot'
          git config --global user.email 'bot@planb.ai'
          git add adaptive_balance_history.json || true
          git commit -m "Auto-update balance history [skip ci]" || true
          git push || true
