name: Apex FVG Radar (24/7 Signal Scanner)

on:
  schedule:
    # Runs every 15 minutes 24/7/365 (Scanning Crypto 24/7 + Gold/Nasdaq/Forex during market hours)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run Apex FVG Signal Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python apex_fvg_signal_engine.py

      - name: Commit state file
        run: |
          git config --global user.name "Apex FVG Bot"
          git config --global user.email "bot@apex.dev"
          git add apex_fvg_state.json || true
          git diff --cached --quiet || git commit -m "Update FVG signal state [skip ci]"
          git push || true
