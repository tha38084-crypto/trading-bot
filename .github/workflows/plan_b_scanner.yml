name: Universal Prop Firm Cloud Market Radar

on:
  schedule:
    - cron: '*/15 * * * 1-5'  # Scans every 15 minutes during active trading days
  workflow_dispatch:          # Allows manual trigger anytime

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance numpy pandas pytz

      - name: Run Universal Prop Firm Master Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROP_ACCOUNT_SIZE: 25000.0
        run: |
          python universal_prop_firm_master.py

      - name: Persist Prop State & Balance
        run: |
          git config --global user.name 'Prop-Cloud-Bot'
          git config --global user.email 'bot@prop.ai'
          git add universal_prop_state.json || true
          git commit -m "Auto-update Prop Bot state [skip ci]" || true
          git push || true
