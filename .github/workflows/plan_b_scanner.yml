name: Plan B AI-Copilot Cloud Scanner

on:
  schedule:
    # Runs every 30 minutes from 8 AM to 5 PM (UTC), Monday to Friday
    # London Open (8-12 GMT) and New York Open (13-17 GMT)
    - cron: '*/30 8-17 * * 1-5'
  workflow_dispatch:  # Allows manual run anytime from GitHub website

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance numpy pandas pytz scikit-learn google-generativeai metaapi-cloud-sdk

      - name: Run Plan B Adaptive AI Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
        run: |
          python plan_b_adaptive.py

      - name: Persist Trade History & Self-Learning Memory
        run: |
          git config --global user.name 'PlanB-Cloud-Bot'
          git config --global user.email 'bot@planb.ai'
          git add adaptive_sent_signals.json adaptive_active_trades.json adaptive_trade_history.json adaptive_balance.json adaptive_learning_log.json adaptive_rules.json adaptive_confidence.json || true
          git commit -m "Auto-update state & learning logs [skip ci]" || true
          git push || true
