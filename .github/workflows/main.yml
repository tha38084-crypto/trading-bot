name: Plan B Telegram Signal Scanner 24/7 Cloud Engine

on:
  schedule:
    - cron: '0 7-17 * * 1-5'
  workflow_dispatch:

jobs:
  run-plan-b-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz

      - name: Execute Live Market Scanner
        run: |
          python plan_b_telegram_scanner.py
